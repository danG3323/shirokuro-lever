<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>白黒つけない会議 - デジタルレバー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* タッチデバイスでの意図しないスクロールを防ぐ（レバー部分のみ適用） */
    body { margin: 0; }
    .touch-none { touch-action: none; }
    /* フェードインアニメーション */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-gradient-to-r from-[#3EB0D6] to-[#8C19FF] bg-fixed min-h-screen text-white font-sans overflow-x-hidden">

  <!-- 背景を少し暗くするための固定半透明オーバーレイ -->
  <div class="fixed inset-0 bg-black/40 pointer-events-none -z-10"></div>

  <!-- 複数のレバーを並べるコンテナ -->
  <div id="levers-container" class="flex flex-wrap justify-center items-end gap-x-16 gap-y-32 pt-24 pb-48 px-8 w-full min-h-screen">
    <!-- レバーはJavaScriptで動的に生成されます -->
  </div>

  <!-- レバー追加ボタン -->
  <button id="addLeverBtn" class="fixed bottom-8 right-8 bg-white text-[#8C19FF] font-bold text-lg py-4 px-8 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-transform z-50 flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    レバーを追加
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyBBFsRcr76d8-FLDVKUOi4F87_3hhrEgcQ",
      authDomain: "shirokuro-lever-sync.firebaseapp.com",
      databaseURL: "https://shirokuro-lever-sync-default-rtdb.firebaseio.com",
      projectId: "shirokuro-lever-sync",
      storageBucket: "shirokuro-lever-sync.firebasestorage.app",
      messagingSenderId: "1022954131194",
      appId: "1:1022954131194:web:7b1a6430d5bf4eb693c343"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const leversRef = ref(db, 'levers');

    const container = document.getElementById('levers-container');
    const addLeverBtn = document.getElementById('addLeverBtn');

    // 画面上のレバー要素を管理
    const localLevers = {};
    let draggingId = null; 

    // --- レバーを1つ画面に作成する関数 ---
    function createLeverDOM(id, data) {
      const wrapper = document.createElement('div');
      wrapper.className = "relative flex flex-col items-center shrink-0 w-[500px] animate-fade-in";
      wrapper.id = `lever-wrapper-${id}`;
      
      wrapper.innerHTML = `
        <!-- 削除ボタン（右上） -->
        <button class="delete-btn absolute -top-16 -right-4 text-white/50 hover:text-white bg-black/20 hover:bg-black/40 rounded-full p-2 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- パーセンテージ ＆ リセットボタン -->
        <div class="flex flex-col items-center z-10 mb-8">
          <div class="percentage-text text-white text-7xl font-black tabular-nums tracking-tight">50%</div>
          <button class="reset-btn mt-4 bg-white/20 hover:bg-white/40 active:scale-95 text-white py-2 px-6 rounded-full backdrop-blur-sm transition-all shadow-lg font-bold">50%に戻す</button>
        </div>

        <!-- レバーと土台 -->
        <div class="relative w-[480px] h-[480px] flex justify-center items-end mt-4">
          <div class="pivot absolute bottom-0 left-1/2 w-[1px] h-[1px] pointer-events-none"></div>
          
          <div class="lever-handle absolute z-10 cursor-grab active:cursor-grabbing touch-none origin-bottom transition-transform duration-100 ease-out" 
               style="width: 200px; height: 500px; bottom: 0; left: 50%; margin-left: -100px;">
            <div class="absolute -inset-10 z-0 pointer-events-auto"></div>
            <svg viewBox="0 0 200 500" class="w-full h-full pointer-events-none overflow-visible relative z-10">
              <defs>
                <mask id="hole-mask-${id}">
                  <rect width="200" height="500" fill="white" />
                  <circle cx="100" cy="80" r="30" fill="black" />
                </mask>
              </defs>
              <g mask="url(#hole-mask-${id})">
                <rect x="75" y="100" width="50" height="400" fill="#3EB0D6" />
                <circle cx="100" cy="80" r="70" fill="#3EB0D6" />
              </g>
            </svg>
          </div>

          <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[480px] h-[240px] pointer-events-none z-20 translate-y-8">
            <svg viewBox="0 0 600 300" class="w-full h-full overflow-visible">
              <!-- 下へ伸びる長さを 2000 から 360 に変更し、いい感じの位置で途切れるようにカット -->
              <path d="M 0 360 L 0 300 A 300 300 0 0 1 600 300 L 600 360 Z" fill="#000000" />
              <path d="M 80 360 L 80 300 A 220 220 0 0 1 520 300 L 520 360 Z" fill="#3EB0D6" />
              <path d="M 210 360 L 210 300 A 90 90 0 0 1 390 300 L 390 360 Z" fill="#8C19FF" />
            </svg>
          </div>
        </div>

        <!-- 名前入力フィールド（上部のマージンを mt-24 に広げてかぶりを防止） -->
        <input type="text" class="name-input mt-24 bg-transparent text-white text-center text-4xl font-bold border-b-2 border-white/30 focus:border-white focus:bg-white/10 outline-none w-full transition py-2 rounded-t-sm" 
               value="${data.name || ''}" placeholder="名前を入力">
      `;

      container.appendChild(wrapper);
      localLevers[id] = { element: wrapper };

      const leverHandle = wrapper.querySelector('.lever-handle');
      const pivot = wrapper.querySelector('.pivot');
      const nameInput = wrapper.querySelector('.name-input');
      const resetBtn = wrapper.querySelector('.reset-btn');
      const deleteBtn = wrapper.querySelector('.delete-btn');
      let isDragging = false;

      resetBtn.addEventListener('click', () => {
        set(ref(db, `levers/${id}/rotation`), 0);
      });

      deleteBtn.addEventListener('click', () => {
        if(confirm("このレバーを削除しますか？")) {
          remove(ref(db, `levers/${id}`));
        }
      });

      nameInput.addEventListener('change', (e) => {
        set(ref(db, `levers/${id}/name`), e.target.value);
      });

      const updateAngle = (clientX, clientY) => {
        const rect = pivot.getBoundingClientRect();
        const pivotX = rect.left + rect.width / 2;
        const pivotY = rect.top + rect.height / 2;
        const dx = clientX - pivotX;
        const dy = clientY - pivotY;

        let angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        if (dy > 0) {
          angleDeg = dx > 0 ? 0 : -180;
        } else {
          angleDeg = Math.max(-180, Math.min(0, angleDeg));
        }

        const rotation = angleDeg + 90;
        applyTransform(id, rotation); 
        set(ref(db, `levers/${id}/rotation`), rotation); 
      };

      leverHandle.addEventListener('pointerdown', (e) => {
        isDragging = true;
        draggingId = id;
        leverHandle.setPointerCapture(e.pointerId);
        leverHandle.style.transition = 'none';
        updateAngle(e.clientX, e.clientY);
      });

      leverHandle.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        updateAngle(e.clientX, e.clientY);
      });

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        isDragging = false;
        draggingId = null;
        leverHandle.releasePointerCapture(e.pointerId);
        leverHandle.style.transition = 'transform 0.1s ease-out';
      };

      leverHandle.addEventListener('pointerup', handlePointerUp);
      leverHandle.addEventListener('pointercancel', handlePointerUp);

      applyTransform(id, data.rotation || 0);
    }

    function applyTransform(id, rotation) {
      if (!localLevers[id]) return;
      const { element } = localLevers[id];
      const leverHandle = element.querySelector('.lever-handle');
      const text = element.querySelector('.percentage-text');
      
      leverHandle.style.transform = `rotate(${rotation}deg)`;
      const rawPercentage = ((rotation + 90) / 180) * 100;
      const percentage = Math.round(rawPercentage / 5) * 5;
      text.innerText = `${percentage}%`;
    }

    addLeverBtn.addEventListener('click', () => {
      push(leversRef, { rotation: 0, name: "新しいレバー" });
    });

    let isFirstLoad = true;
    onValue(leversRef, (snapshot) => {
      const data = snapshot.val() || {};

      if (isFirstLoad && Object.keys(data).length === 0) {
        push(leversRef, { rotation: 0, name: "名前" });
        isFirstLoad = false;
        return;
      }
      isFirstLoad = false;
      
      Object.keys(data).forEach(id => {
        if (!localLevers[id]) {
          createLeverDOM(id, data[id]);
        } else {
          if (draggingId !== id) applyTransform(id, data[id].rotation || 0);
          
          const nameInput = localLevers[id].element.querySelector('.name-input');
          if (document.activeElement !== nameInput && data[id].name !== undefined) {
            nameInput.value = data[id].name;
          }
        }
      });
      
      Object.keys(localLevers).forEach(id => {
        if (!data[id]) {
          localLevers[id].element.remove();
          delete localLevers[id];
        }
      });
    });
  </script>
</body>
</html>
